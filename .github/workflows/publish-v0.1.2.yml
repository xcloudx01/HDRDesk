name: Publish HDRDesk v0.1.2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v0.1.2.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET: 77f16d6bcfa673f3ae61ab045e12fe199609ac01
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 77f16d6bcfa673f3ae61ab045e12fe199609ac01
          persist-credentials: false
      - name: Verify icon-enabled production binary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET"
          test "$(git hash-object HDRDesk.exe)" = "39f2fab535a62b9126fe7b3a6f217ce126ab16dc"
          printf '%s  HDRDesk.exe\n' '561e8afcc0174ea51855c0b7cbd5279621169ebb1eb6b17eb147b4559f924c90' > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Publish versioned release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.1.2 >/dev/null 2>&1; then
            echo "::error::v0.1.2 already exists; refusing to replace the release."
            exit 1
          fi
          cat > release-notes.md <<'NOTES'
          Portable Windows x64 release of HDRDesk with its new custom application icon.

          - New display-and-sliders icon embedded in HDRDesk.exe, including 16, 24, 32, 48, 64, 128, and 256 px resolutions.
          - Icon integrated with Windows Explorer, the taskbar and application window.
          - Built with Python 3.15 and PyInstaller 6.22.3.
          - Production build passed Windows x64 executable checks and the seven-size embedded-icon verification.
          - Build artifact was downloaded and its SHA-256 checked before publication.

          No separate Python installation is required. Unzip or save the executable to a writable folder. The executable is unsigned; Windows SmartScreen may display a warning. The CI checks do not substitute for physical HDR and NVIDIA driver testing.

          Verified build: https://github.com/xcloudx01/HDRDesk/actions/runs/45001282464
          NOTES
          gh release create v0.1.2 HDRDesk.exe SHA256SUMS.txt \
            --target "$TARGET" --title "HDRDesk v0.1.2" \
            --notes-file release-notes.md --latest
