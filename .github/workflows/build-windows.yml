name: Build Windows executable

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - HDRDesk.pyw
      - displaycore.py
      - nvescape.py
      - nvhdr.py
      - .github/workflows/build-windows.yml
  push:
    branches: [main]
    paths:
      - HDRDesk.pyw
      - displaycore.py
      - nvescape.py
      - nvhdr.py
      - .github/workflows/build-windows.yml

permissions:
  contents: read

concurrency:
  group: hdrdesk-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
          architecture: x64
      - name: Build portable executable
        shell: pwsh
        run: |
          python -m pip install "pyinstaller==6.22.3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m py_compile HDRDesk.pyw displaycore.py nvescape.py nvhdr.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --clean --noconfirm --onefile --windowed --name HDRDesk HDRDesk.pyw
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate executable format
        shell: pwsh
        run: |
          python -c "import pathlib, struct; p=pathlib.Path('dist/HDRDesk.exe'); b=p.read_bytes(); assert b[:2]==b'MZ'; o=struct.unpack_from('<I',b,60)[0]; assert b[o:o+4]==b'PE\x00\x00'; assert struct.unpack_from('<H',b,o+4)[0]==0x8664; assert struct.unpack_from('<H',b,o+24+68)[0]==2; print(p, len(b), 'bytes; Windows x64 GUI executable')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash dist/HDRDesk.exe -Algorithm SHA256
      - uses: actions/upload-artifact@v7
        with:
          name: HDRDesk-windows-x64
          path: dist/HDRDesk.exe
          if-no-files-found: error
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: HDRDesk-windows-x64
          path: dist
      - name: Publish executable to repository
        shell: pwsh
        run: |
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((git rev-parse HEAD) -ne (git rev-parse origin/main)) {
            throw 'main changed during the build; refusing to publish a stale executable.'
          }
          Copy-Item dist/HDRDesk.exe HDRDesk.exe -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HDRDesk.exe
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "Build HDRDesk Windows x64 executable"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
