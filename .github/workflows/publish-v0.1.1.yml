name: Publish HDRDesk v0.1.1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v0.1.1.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET: bc9bcc1ead12bbbaea45aa2d8a4e60167d98f148
    steps:
      - uses: actions/checkout@v7
        with:
          ref: bc9bcc1ead12bbbaea45aa2d8a4e60167d98f148
          persist-credentials: false
      - name: Verify known production binary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET"
          test "$(git hash-object HDRDesk.exe)" = "a3ece4abdf18462db7d8d429a7a879514240ccac"
          printf '%s  HDRDesk.exe\n' '0c131c03b1138d19f4c9c7ce907455b175dee9d317b927974e8d36b485e2c617' > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Publish verified executable
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.1.1 >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace it."
            exit 1
          fi
          cat > release-notes.md <<'NOTES'
          Maintenance release: updated portable Windows x64 build of HDRDesk.

          - Python 3.15 and PyInstaller 6.22.3.
          - Updated GitHub Actions dependencies.
          - Executable validated and verified by SHA-256 after artifact upload/download.
          - No changes to display-control behavior.

          Download HDRDesk.exe and place it in a writable folder. No separate Python installation is required. The binary is unsigned; Windows may display a SmartScreen warning. Physical HDR and NVIDIA driver behavior have not been retested for this build.

          Build: https://github.com/xcloudx01/HDRDesk/actions/runs/45000594587
          NOTES
          gh release create v0.1.1 HDRDesk.exe SHA256SUMS.txt \
            --target "$TARGET" --title "HDRDesk v0.1.1" \
            --notes-file release-notes.md --latest
